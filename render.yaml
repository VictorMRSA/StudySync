#   Deploy do backend StudySync no Render (plano gratuito).
#   O Render lê este arquivo automaticamente ao criar um "Blueprint".
#   A chave GEMINI_API_KEY NÃO fica aqui: ela é pedida no painel do Render (sync: false).
services:
  - type: web
    name: studysync-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
